name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      # GitHub Pages has no SPA rewrite rule. Two measures so every route works:
      #  1. a real index.html for each URL in the sitemap (returns 200, good for
      #     link previews and search), 2. index.html as the 404 page for anything else.
      - name: Pre-render route shells
        run: |
          for path in $(grep -o '<loc>[^<]*</loc>' public/sitemap.xml | sed -E 's#</?loc>##g; s#https://[^/]+##' | grep -v '^/$'); do
            mkdir -p "dist$path" && cp dist/index.html "dist$path/index.html"
          done
          cp dist/index.html dist/404.html
          find dist -name index.html | wc -l
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
